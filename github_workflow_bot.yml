# Corre el bot gratis en GitHub Actions (repo público).
# Solo sirve para tiendas oficiales: las búsquedas y categorías piden sesión.
# Necesita los secrets TELEGRAM_TOKEN y TELEGRAM_CHAT_ID (ver README).
name: Bot Mercado Libre

on:
  schedule:
    - cron: "17 */2 * * *"   # cada 2 horas (hora UTC); GitHub puede retrasarlo unos minutos
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: bot-mercado
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Revisar ofertas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Guardar historial
        if: always()
        run: |
          git config user.name "bot-mercado"
          git config user.email "bot-mercado@users.noreply.github.com"
          git add -f datos.db config.json
          git diff --cached --quiet || (git commit -m "Actualizar historial de precios" && git push)
